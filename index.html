<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Chatbot</title>
</head>
<body>

<h2>Chatbot سياحي</h2>

<input id="msg" placeholder="اكتب طلبك هنا">
<button onclick="handle()">إرسال</button>

<ul id="result"></ul>

<script>

function detectType(text) {
  if (text.includes("وقت") || text.includes("متى") || text.includes("أفضل وقت")) {
    return "time";
  }
  return "place";
}

function classify(text) {
  if (text.includes("بحر")) return "1";
  else if (text.includes("جبل") || text.includes("جبال")) return "2";
  else if (text.includes("طبيعة") || text.includes("وادي")) return "3";
  else if (text.includes("تاريخ") || text.includes("اثري")) return "4";
  else return "0";
}

function detectPlace(text) {
  if (text.includes("جدة")) return "jeddah";
  else if (text.includes("العلا")) return "ula";
  else if (text.includes("فرسان")) return "farasan";
  else if (text.includes("أملج")) return "umlaj";
  else return null;
}

const data = {
  "1": ["جزر فرسان", "جزر أملج", "كورنيش جدة"],
  "2": ["جبل السودة", "حافة العالم"],
  "3": ["غابات رغدان", "وادي لجب"],
  "4": ["العلا"]
};

const placeData = {
  "jeddah": "أفضل وقت لزيارة جدة من نوفمبر إلى مارس",
  "ula": "أفضل وقت لزيارة العلا من أكتوبر إلى أبريل",
  "farasan": "أفضل وقت لزيارة جزر فرسان من أكتوبر إلى مارس",
  "umlaj": "أفضل وقت لزيارة أملج من أكتوبر إلى مايو"
};

function handle() {
  const input = document.getElementById("msg").value;
  const type = detectType(input);
  const choice = classify(input);
  const place = detectPlace(input);

  const list = document.getElementById("result");
  list.innerHTML = "";

  if (choice === "0" && !place) {
    const li = document.createElement("li");
    li.innerText = "عذرًا، لم أفهم طلبك بشكل واضح. يرجى التوضيح (مثل: بحر، جبل، جدة، وقت الزيارة).";
    list.appendChild(li);
    return;
  }

  if (type === "time" && place) {
    const li = document.createElement("li");
    li.innerText = placeData[place];
    list.appendChild(li);
    return;
  }

  if (type === "time" && !place) {
    const li = document.createElement("li");
    li.innerText = "يرجى تحديد المكان لمعرفة أفضل وقت للزيارة (مثل: جدة، العلا).";
    list.appendChild(li);
    return;
  }

  if (type === "place" && choice !== "0") {
    const title = document.createElement("li");
    title.innerText = "بكل سرور، هذه قائمة بأفضل الأماكن التي يمكنك زيارتها:";
    list.appendChild(title);

    data[choice].forEach(place => {
      const li = document.createElement("li");
      li.innerText = "• " + place;
      list.appendChild(li);
    });
  }
}

</script>

</body>
</html>
