<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Chatbot</title>
</head>
<body>

<h2>Chatbot بسيط</h2>

<input id="msg" placeholder="اكتب طلبك هنا">
<button onclick="handle()">إرسال</button>

<ul id="result"></ul>

<script>
function classify(text) {
  if (text.includes("بحر")) return "1";
  else if (text.includes("جبل") || text.includes("جبال")) return "2";
  else if (text.includes("طبيعة") || text.includes("وادي")) return "3";
  else if (text.includes("تاريخ") || text.includes("اثري")) return "4";
  else return "0";
}

function recommend(choice) {
  const data = {
    "1": [
      {name: "جزر فرسان", time: "أكتوبر — مارس"},
      {name: "جزر أملج", time: "أكتوبر — مايو"},
      {name: "كورنيش جدة", time: "نوفمبر — مارس"}
    ],
    "2": [
      {name: "جبل السودة", time: "صيفاً"},
      {name: "حافة العالم", time: "أكتوبر — أبريل"}
    ],
    "3": [
      {name: "غابات رغدان", time: "طوال السنة"},
      {name: "وادي لجب", time: "شتاءً وربيعاً"}
    ],
    "4": [
      {name: "العلا", time: "أكتوبر — أبريل"}
    ]
  };

  return data[choice] || [{name: "لم أفهم طلبك", time: "-"}];
}

function handle() {
  const input = document.getElementById("msg").value;
  const choice = classify(input);
  const results = recommend(choice);

  const list = document.getElementById("result");
  list.innerHTML = "";

  results.forEach(place => {
    const li = document.createElement("li");
    li.innerText = place.name + " - " + place.time;
    list.appendChild(li);
  });
}
</script>

</body>
</html>
